<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F11" />
    <meta name="description" content="BDRT Holdings homepage hero image." />
    <title>BDRT Holdings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero" aria-label="BDRT Holdings">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="BDRT Holding home">
          <span class="wordmark__main">BDRT</span>
          <span class="wordmark__sub">HOLDING</span>
        </a>
      </header>

      <img
        class="hero__image"
        src="https://unsplash.com/photos/s3VxCT4p8FM/download?force=true&amp;w=2400"
        alt="Fashion editorial portrait of a model seated in a wooden chair on a concrete floor."
        fetchpriority="high"
        decoding="async"
      />
    </main>
  </body>
</html>
