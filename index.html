<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F11" />
    <meta name="description" content="BDRT Holdings homepage hero image." />
    <title>BDRT Holdings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero" id="home" aria-label="BDRT Holdings">
      <header class="site-header">
        <svg class="wordmark-frame" viewBox="0 0 140 118" preserveAspectRatio="none" aria-hidden="true">
          <path class="wordmark-frame__fill" d="M1 0 H139 V68 C139 95 110 116 70 116 C30 116 1 95 1 68 Z" />
          <path class="wordmark-frame__stroke" d="M1 0 V68 C1 95 30 116 70 116 C110 116 139 95 139 68 V0" />
        </svg>
        <nav class="site-nav site-nav--left" aria-label="Main navigation">
          <a href="#home" aria-current="page">HOME</a>
          <a href="#about">ABOUT</a>
          <a href="#businesses">BUSINESSES</a>
          <a href="#our-brands">OUR BRANDS</a>
        </nav>

        <a class="wordmark" href="#home" aria-label="BDRT Holding home">
          <span class="wordmark__main">BDRT</span>
          <span class="wordmark__sub">HOLDING</span>
        </a>

        <nav class="site-nav site-nav--right" aria-label="Secondary navigation">
          <a href="#portfolio">PORTFOLIO</a>
          <a href="#contact">CONTACT</a>
          <a href="#client-login">CLIENT LOGIN</a>
          <a href="#donor-portal">DONOR PORTAL</a>
        </nav>
      </header>

      <img
        class="hero__image"
        src="https://unsplash.com/photos/s3VxCT4p8FM/download?force=true&amp;w=2400"
        alt="Fashion editorial portrait of a model seated in a wooden chair on a concrete floor."
        fetchpriority="high"
        decoding="async"
      />
    </main>
  </body>
</html>
