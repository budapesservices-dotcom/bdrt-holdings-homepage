<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F11" />
    <meta name="description" content="BDRT Holdings homepage with a looping video hero." />
    <title>BDRT Holdings</title>
    <link rel="stylesheet" href="./styles.css?v=magazine-stack-2" />
  </head>
  <body>
    <main class="page">
      <div class="magazine-stack">
        <section class="hero" id="home" aria-label="BDRT Holdings">
          <header class="site-header">
            <svg class="wordmark-frame" viewBox="0 0 130 116" preserveAspectRatio="none" aria-hidden="true">
              <path class="wordmark-frame__stroke" d="M1 0 V31 C1 76 29.654 113 65 113 C100.346 113 129 76 129 31 V0" />
              <path class="wordmark-frame__fill" d="M1 0 H129 V31 C129 76 100.346 113 65 113 C29.654 113 1 76 1 31 Z" />
            </svg>

            <nav class="site-nav site-nav--left" aria-label="Main navigation">
              <a href="#home" aria-current="page">HOME</a>
              <a href="#about">ABOUT</a>
              <a href="#businesses">BUSINESSES</a>
              <a href="#our-brands">OUR BRANDS</a>
            </nav>

            <a class="wordmark" href="#home" aria-label="BDRT Holdings home">
              <span class="wordmark__main">BDRT</span>
              <span class="wordmark__sub">HOLDINGS</span>
            </a>

            <nav class="site-nav site-nav--right" aria-label="Secondary navigation">
              <a href="#portfolio">PORTFOLIO</a>
              <a href="#contact">CONTACT</a>
              <a href="#client-login">CLIENT LOGIN</a>
              <a href="#donor-portal">DONOR PORTAL</a>
            </nav>
          </header>

          <video
            class="hero__video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
          >
            <source
              src="https://www.dropbox.com/scl/fi/kdqyesm9g437sj5ll2gob/model-onboarding-hero.mp4?rlkey=5djiv6x231vjlw78dgsfapk24&amp;raw=1"
              type="video/mp4"
            />
          </video>
        </section>

        <section class="about-section" id="about" aria-labelledby="about-title">
          <div class="about-section__inner">
            <p class="about-section__eyebrow">A CLOSER LOOK</p>
            <h1 id="about-title">Discover BDRT Holdings.</h1>
            <p class="about-section__copy">Explore the businesses, portfolio, and brands behind the name.</p>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const stack = document.querySelector(".magazine-stack");
        const cover = document.querySelector(".hero");
        if (!stack || !cover) return;

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        let framePending = false;

        const updatePageTurn = () => {
          framePending = false;
          const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
          const top = stack.getBoundingClientRect().top;
          const progress = Math.min(1, Math.max(0, -top / Math.max(1, viewportHeight)));
          const angle = reduceMotion.matches ? 0 : -7 * progress;

          cover.style.setProperty("--hero-turn-y", `${(-progress * 100).toFixed(2)}%`);
          cover.style.setProperty("--hero-turn-angle", `${angle.toFixed(2)}deg`);
          cover.style.setProperty("--hero-turn-shadow", `${(0.32 * progress).toFixed(3)}`);
        };

        const requestPageTurnUpdate = () => {
          if (framePending) return;
          framePending = true;
          window.requestAnimationFrame(updatePageTurn);
        };

        window.addEventListener("scroll", requestPageTurnUpdate, { passive: true });
        window.addEventListener("resize", requestPageTurnUpdate);
        if (typeof reduceMotion.addEventListener === "function") {
          reduceMotion.addEventListener("change", requestPageTurnUpdate);
        }
        updatePageTurn();
      })();
    </script>
  </body>
</html>
